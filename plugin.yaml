description: "Publish marked assistant replies to mdpubs.com and return a short title + link. Supports Markdown and HTML notes, e-signable documents (mdpubs-sign frontmatter + sign-here anchors), unguessable publicId URLs, and org/account filing via mdpubs-account. CLI passes through unchanged."
