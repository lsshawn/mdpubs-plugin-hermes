name: mdpubs
version: 2.1.0
description: "Publish marked assistant replies to mdpubs.com and return a short title + link. Supports Markdown and HTML notes, e-signable documents (markdown mdpubs-sign frontmatter or HTML mdpubs-sign/mdpubs-signer comment markers), unguessable publicId URLs, and org/company filing via mdpubs-company. CLI passes through unchanged."
author: "sshawn"
homepage: "https://github.com/lsshawn/mdpubs-plugin-hermes"
hooks:
  - transform_llm_output
